# Standalone harness (its own workspace): paired OLD-vs-NEW remeasurement for
# cloudbring/artcraft-algorithms#190 (photocraft claims C02, C03, C08).
# OLD = storytold/photocraft at the merge-base of the source branches with origin/main.
# NEW = this checkout (path), at the source-branch commit recorded in the output JSON.
[package]
name = "perf-remeasure"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
craft-bench = { git = "https://github.com/cloudbring/craft-libs", rev = "94c6d76e5bc2c936d3db5ce5e19d70213e8390c0" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

old-algo = { package = "photocraft-algo", git = "https://github.com/storytold/photocraft", rev = "327c4cc82e737a3e0af7c147a477126d77525495" }
new-algo = { package = "photocraft-algo", path = "../../crates/algo" }
old-psd = { package = "photocraft-psd", git = "https://github.com/storytold/photocraft", rev = "327c4cc82e737a3e0af7c147a477126d77525495" }
new-psd = { package = "photocraft-psd", path = "../../crates/psd" }

[profile.release]
lto = "thin"
codegen-units = 1
